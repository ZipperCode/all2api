services:
  all2api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: all2api
    restart: unless-stopped
    ports:
      - "${ALL2API_PORT:-8080}:8080"
    environment:
      GW_SERVER_PORT: "8080"
      # 可选：用环境变量覆盖管理后台 key，优先级高于 config.yaml。
      # GW_ADMIN_KEY: "replace-me"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/__gateway/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
