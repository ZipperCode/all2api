server:
  host: "0.0.0.0"
  port: 8080

upstream:
  base_url: "https://v3.football.api-sports.io"
  timeout_seconds: 30

scheduler:
  switch_threshold: 1
  rate_limit_cooldown_seconds: 60
  error_cooldown_seconds: 30
  max_error_count: 3
  max_retries: 3

keys:
  - label: "key-1"
    key: "your_real_api_key_1"
  - label: "key-2"
    key: "your_real_api_key_2"

client_auth:
  enabled: false
  # tokens: ["future-token-1"]

logging:
  level: "info"
