server:
  host: "0.0.0.0"
  port: 8080

# platforms：下游请求路径 /<namespace>/<原路径> 按站点命名空间选上游。
# 每个 namespace 绑定一个 provider 类型和一个 credential_pool。
platforms:
  api-sports:
    type: "api_sports"
    base_url: "https://v3.football.api-sports.io"
    timeout_seconds: 30
    credential_pool: "api-sports"
  api-basketball:
    type: "api_sports"
    base_url: "https://v1.basketball.api-sports.io"
    timeout_seconds: 30
    credential_pool: "api-sports"

  # 通用 Header 凭证平台：适合 X-API-Key、Authorization: Bearer 等纯转发 API。
  weather:
    type: "generic_http"
    base_url: "https://api.weather.example"
    timeout_seconds: 30
    credential_pool: "weather"
    auth:
      header: "Authorization"
      prefix: "Bearer"
    # 可选：如果上游有额度 header，可配置后进入 /__gateway/status。
    rate_limit:
      daily_limit_header: "X-Daily-Limit"
      daily_remaining_header: "X-Daily-Remaining"

credential_pools:
  api-sports:
    keys:
      - label: "key-1"
        key: "your_real_api_sports_key_1"
      - label: "key-2"
        key: "your_real_api_sports_key_2"
  weather:
    keys:
      - label: "primary"
        key: "your_weather_api_key"

scheduler:
  switch_threshold: 1
  rate_limit_cooldown_seconds: 60
  error_cooldown_seconds: 30
  max_error_count: 3
  max_retries: 3

management:
  # 管理后台登录 key；也可用 GW_ADMIN_KEY 覆盖。
  admin_key: "change-this-admin-key"
  log_file: "logs/gateway.jsonl"
  log_read_limit: 500

client_auth:
  # 开启后，下游调用网关需要使用这里的客户端密钥。
  # 认证头保持站点官方方式，例如 API-Sports 用 x-apisports-key。
  enabled: true
  tokens:
    - "client-token-1"

logging:
  level: "info"
