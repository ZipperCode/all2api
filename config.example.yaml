server:
  host: "0.0.0.0"
  port: 8080

# workspaces：下游请求路径 /<workspace>/<原路径> 按 workspace 选上游。
# 一套 key 池被所有 workspace 共享（API-Sports 同 key 可访问多个体育子站）。
workspaces:
  football:
    base_url: "https://v3.football.api-sports.io"
    timeout_seconds: 30
  basketball:
    base_url: "https://v1.basketball.api-sports.io"
    timeout_seconds: 30
  baseball:
    base_url: "https://v1.baseball.api-sports.io"
    timeout_seconds: 30

scheduler:
  switch_threshold: 1
  rate_limit_cooldown_seconds: 60
  error_cooldown_seconds: 30
  max_error_count: 3
  max_retries: 3

keys:
  - label: "key-1"
    key: "your_real_api_key_1"
  - label: "key-2"
    key: "your_real_api_key_2"

client_auth:
  enabled: false
  # tokens: ["future-token-1"]

logging:
  level: "info"
